[project]
name = "vmctl-core"
version = "0.1.0"
description = "Shared core for VM conservation controllers: pluggable VM backends, the shared plugin spec, snapshots, screen, and guest I/O."
authors = [{ name = "Marc Schütze", email = "mschuetze@zkm.de" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dynamic = ["dependencies"]  # deps stay in [tool.poetry.dependencies] (caret constraints)

[tool.poetry]
packages = [{ include = "vmctl_core" }]
# PEP 561: vmctl_core is fully typed and mypy-gated in CI, but without this marker every consumer
# (rvmc, autopsy, evmc) sees it as an untyped third-party import and silently loses the checking —
# it showed up as 8 `import-untyped` errors the moment evmc turned mypy on.
include = [{ path = "vmctl_core/py.typed", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
pydantic = "^2.14.4"
pydantic-settings = "^2.16.3"
pyyaml = "^6.0.4"
jinja2 = "^3.1.6"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
ruff = "^0.17.6"
mypy = "^2.4.1"
types-pyyaml = "^6.0.12.20260518"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
# Preserve the upstream, Python 2.3-compatible reference codec byte-for-byte.
extend-exclude = ["vmctl_core/agentwire/_va1.py"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
