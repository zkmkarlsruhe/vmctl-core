[project]
name = "vmctl-core"
version = "0.1.0"
description = "Shared core for VM conservation controllers: pluggable VM backends, the shared plugin spec, snapshots, screen, and guest I/O."
authors = [{ name = "Marc Schütze", email = "mschuetze@zkm.de" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dynamic = ["dependencies"]  # deps stay in [tool.poetry.dependencies] (caret constraints)

[tool.poetry]
packages = [{ include = "vmctl_core" }]

[tool.poetry.dependencies]
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
pyyaml = "^6.0.1"
jinja2 = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
ruff = "^0.15.0"
mypy = "^2.0.0"
types-pyyaml = "^6.0.12.20260518"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
